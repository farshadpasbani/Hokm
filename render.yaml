# Render.com blueprint: deploys the Hokm Telegram Mini App service.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hokm-mini-app
    runtime: docker
    plan: starter          # free plan sleeps on idle; starter stays warm
    healthCheckPath: /healthz
    # No persistent disk. Finished hands (training data) and the player log
    # are written to an external Postgres via DATABASE_URL — see store.py.
    envVars:
      - key: BOT_TOKEN
        sync: false        # set in the Render dashboard (secret)
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEBAPP_URL
        sync: false        # set to this service's public URL after first deploy
      - key: ALLOW_GUESTS
        value: "0"
      - key: DATABASE_URL
        sync: false        # Neon/Supabase connection string (secret)
      - key: ADMIN_TOKEN
        generateValue: true
